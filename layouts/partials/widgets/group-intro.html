{{- $section := .page -}}
<section class="smile-home-intro" aria-labelledby="smile-home-intro-title">
  <div class="container">
    <h1 id="smile-home-intro-title">{{ $section.Title }}</h1>
    <div class="smile-home-intro__body">{{ $section.Content }}</div>
  </div>
</section>
<style>
  .smile-home-intro {
    padding: 1.6rem 0 2rem;
  }
  .smile-home-intro .container {
    max-width: 1080px;
  }
  .smile-home-intro h1 {
    margin: 0 0 .65rem;
    font-size: clamp(1.75rem, 2.4vw, 2.3rem);
    line-height: 1.2;
    font-weight: 650;
  }
  .smile-home-intro__body {
    max-width: 920px;
    font-size: 1.08rem;
    line-height: 1.7;
  }
  .smile-home-intro__body p {
    margin: 0 0 .75rem;
  }
  .smile-home-intro__body p:last-child {
    margin-bottom: 0;
  }
</style>
