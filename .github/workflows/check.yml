name: Check website
# Manual only, to avoid using Actions minutes on every pull request.
# Run it from the Actions tab (Run workflow) or locally with `npm run check`.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: npm run check
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: website-preview
          path: out
          include-hidden-files: true
